name: Release

# By default, releases are published in this repository. To keep source private
# and publish binaries elsewhere, set the SNIPASTE_RELEASE_REPOSITORY repository
# variable and a RELEASE_TOKEN secret with contents write access to that target.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching CMakeLists.txt, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      repository: ${{ steps.version.outputs.repository }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ vars.SNIPASTE_RELEASE_REPOSITORY || github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a version tag such as v0.1.3 or v0.1.3-rc.1' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "repository=$RELEASE_REPOSITORY" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            qt-arch: win64_msvc2022_64
            artifact: windows-x64
            preset: windows-msvc-release
          - os: macos-26
            qt-arch: clang_64
            artifact: macos-arm64
            preset: macos-release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.12.0'
          # aqtinstall 3.3.0 cannot read the Windows Qt 6.11+ repository layout.
          # Pin the upstream fix so dependency installation is reproducible.
          aqtsource: https://github.com/miurahr/aqtinstall/archive/076e1659807d0b362a3ed684d54c2e9c775eb9c7.tar.gz
          arch: ${{ matrix.qt-arch }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          UPDATE_REPOSITORY: ${{ needs.version.outputs.repository }}
        run: |
          cmake --preset "$BUILD_PRESET" -DSNIPASTE_RELEASE_VERSION="$RELEASE_VERSION" -DSNIPASTE_UPDATE_REPOSITORY="$UPDATE_REPOSITORY"
      - name: Build
        run: cmake --build --preset "$BUILD_PRESET"
      - name: Test
        run: ctest --preset "$BUILD_PRESET" -E '^ocr_overlay$'
      - name: Check OCR (non-blocking)
        id: ocr_tests
        continue-on-error: true
        run: ctest --preset "$BUILD_PRESET" -R '^ocr_overlay$'
      - name: Print failed test diagnostics
        if: failure() || steps.ocr_tests.outcome == 'failure'
        shell: bash
        run: |
          for log in build/"$BUILD_PRESET"/*results*.txt build/"$BUILD_PRESET"/Testing/Temporary/LastTest.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
      - name: Upload failed test diagnostics
        if: failure() || steps.ocr_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics-${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/*results*.txt
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $nsisZip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' -OutFile $nsisZip
          if ((Get-FileHash $nsisZip -Algorithm SHA256).Hash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') { throw 'NSIS checksum mismatch.' }
          $env:NSIS_ROOT = Join-Path $env:RUNNER_TEMP 'nsis-3.13'
          # The ZIP already contains the nsis-3.13 top-level directory.
          Expand-Archive $nsisZip -DestinationPath $env:RUNNER_TEMP
          if (-not (Test-Path -LiteralPath (Join-Path $env:NSIS_ROOT 'makensis.exe') -PathType Leaf)) {
            throw "NSIS compiler was not found after extraction: $env:NSIS_ROOT"
          }
          cmake --build --preset $env:BUILD_PRESET --target package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SNIPASTE_TEST_SETUP = (Resolve-Path "dist/snipaste-$env:RELEASE_VERSION-windows-x64-setup.exe").Path
          python tests/update_installer_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package macOS
        if: runner.os == 'macOS'
        run: cmake --build --preset "$BUILD_PRESET" --target package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          repository: ${{ needs.version.outputs.repository }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: snipaste ${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: ${{ needs.version.outputs.repository == github.repository }}
          body: |
            Windows: run the windows-x64-setup.exe installer.
            macOS (Apple Silicon): open the macos-arm64.dmg and drag snipaste.app to Applications.
            Both packages include the Qt runtime and have SHA-256 checksum files. In-app updates download, verify, install and restart automatically.
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
